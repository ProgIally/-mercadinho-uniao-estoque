{% extends "base.html" %} {% block title %}Cadastrar Produto - Mercadinho
União{% endblock %} {% block content %}

<style>
  .card-cadastro {
    max-width: 550px;
    margin: 0 auto;
    padding: 30px;
  }

  .form-cadastro label {
    display: block;
    margin-top: 20px;
    font-weight: bold;
  }

  .form-cadastro input {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
  }

  .form-cadastro button {
    width: 100%;
    padding: 14px;
    background: #146c43;
    color: white;
    border: none;
    border-radius: 6px;
    margin-top: 25px;
    cursor: pointer;
    font-weight: bold;
  }

  .form-cadastro button:hover {
    background: #0e4f30;
  }

  .voltar {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #146c43;
  }

  body.alto-contraste .form-cadastro label {
    color: #fff !important;
  }

  body.alto-contraste .form-cadastro input {
    background: #000 !important;
    color: #fff !important;
    border: 2px solid #ffff00 !important;
  }

  body.alto-contraste .form-cadastro button {
    background: #ffff00 !important;
    color: #000 !important;
    border: 2px solid #fff !important;
  }

  body.alto-contraste .voltar {
    color: #ffff00 !important;
  }
</style>

<div class="card card-cadastro">
  <h2>Novo Produto</h2>

  <form class="form-cadastro" method="POST" action="{{ url_for('cadastro') }}">
    <label for="nome">Nome do Produto</label>
    <input
      type="text"
      id="nome"
      name="nome"
      placeholder="Ex: Feijão 1kg"
      maxlength="100"
      required
    />

    <label for="quantidade">Quantidade Inicial</label>
    <input
      type="number"
      id="quantidade"
      name="quantidade"
      min="0"
      step="1"
      required
    />

    <label for="estoque_minimo">Estoque Mínimo</label>
    <input
      type="number"
      id="estoque_minimo"
      name="estoque_minimo"
      min="0"
      step="1"
      required
    />

    <button type="submit">Cadastrar Produto</button>
  </form>

  <a class="voltar" href="{{ url_for('inicio') }}"> Voltar ao Estoque </a>
</div>

{% endblock %}
