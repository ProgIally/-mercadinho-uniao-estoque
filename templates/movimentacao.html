{% extends "base.html" %} {% block title %}Movimentação - Mercadinho União{%
endblock %} {% block content %}

<style>
  .card-movimentacao {
    max-width: 550px;
    margin: 0 auto;
  }

  .form-movimentacao label {
    display: block;
    margin: 18px 0 8px;
    font-weight: bold;
  }

  .form-movimentacao select,
  .form-movimentacao input {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    border-radius: 6px;
    border: 1px solid #ccc;
  }

  .form-movimentacao button {
    width: 100%;
    padding: 12px;
    border-radius: 6px;
    background: #146b46;
    color: white;
    border: none;
    margin-top: 25px;
    cursor: pointer;
    font-weight: bold;
  }

  .form-movimentacao button:hover {
    background: #105537;
  }

  .voltar {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #146b46;
  }

  body.alto-contraste .form-movimentacao label {
    color: #fff !important;
  }

  body.alto-contraste .form-movimentacao button {
    background: #ffff00 !important;
    color: #000 !important;
    border: 2px solid #fff !important;
  }

  body.alto-contraste .voltar {
    color: #ffff00 !important;
  }
</style>

<div class="card card-movimentacao">
  <h2>Entrada e Saída de Produtos</h2>

  <form
    class="form-movimentacao"
    method="POST"
    action="{{ url_for('movimentacao') }}"
  >
    <label for="produto_id">Produto</label>
    <select name="produto_id" id="produto_id" required>
      <option value="">Selecione um produto</option>
      {% for produto in produtos %}
      <option value="{{ produto.id }}">
        {{ produto.nome }} - Estoque: {{ produto.quantidade }}
      </option>
      {% endfor %}
    </select>

    <label for="tipo">Tipo de Movimentação</label>
    <select name="tipo" id="tipo" required>
      <option value="entrada">Entrada</option>
      <option value="saida">Saída</option>
    </select>

    <label for="quantidade">Quantidade</label>
    <input
      type="number"
      name="quantidade"
      id="quantidade"
      min="1"
      step="1"
      required
    />

    <button type="submit">Registrar Movimentação</button>
  </form>

  <a class="voltar" href="{{ url_for('inicio') }}"> Voltar ao Estoque </a>
</div>

{% endblock %}
